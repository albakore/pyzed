name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pr-title.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/docs.yml"
      - ".github/workflows/pr-title.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI builds only need to be correct, not as small and fast as the published
  # wheels: skip LTO and use more codegen units (release.yml keeps the full
  # profile from Cargo.toml).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Lint and the MSRV build only look at Rust: skip them when a change leaves it alone.
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - "src/**"
              - "vendor/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - ".github/workflows/ci.yml"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  msrv:
    # Keep in sync with `rust-version` in Cargo.toml: catches syntax that
    # newer compilers accept but users with an older rustc can't build.
    name: Rust 1.88 (MSRV)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --locked --all-targets

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs one job per OS, spread over the oldest, a middle and the newest
        # supported Python. main and manual runs test Linux on 3.10, 3.12 and 3.14, Linux on ARM,
        # Windows and macOS.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os": "ubuntu-latest", "python": "3.14"}, {"os": "windows-latest", "python": "3.12"}, {"os": "macos-latest", "python": "3.10"}]'
          || '[{"os": "ubuntu-latest", "python": "3.10"}, {"os": "ubuntu-latest", "python": "3.12"}, {"os": "ubuntu-latest", "python": "3.14"}, {"os": "ubuntu-24.04-arm", "python": "3.12"}, {"os": "windows-latest", "python": "3.12"}, {"os": "macos-latest", "python": "3.12"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install maturin pytest pytest-xdist pillow mcp anthropic
          maturin build --release --out dist
      - name: Install and test it
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist pyzed-ui
          python -m pytest -q -n auto tests
      - name: Upload the visual diffs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-${{ matrix.os }}-py${{ matrix.python }}
          path: tests/visual/output/
          if-no-files-found: ignore

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Preview the next release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install git-cliff
          python scripts/changelog.py --preview | tee -a "$GITHUB_STEP_SUMMARY"
