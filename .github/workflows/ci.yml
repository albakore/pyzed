name: CI

on:
  # Every push and pull request starts the workflow; the `changes` job decides what runs. (GitHub's
  # paths/paths-ignore filters only look at the first 300 changed files, so big pull requests
  # skipped their tests.)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # CI builds only need to be correct, not as small and fast as the published
  # wheels: skip LTO and use more codegen units (release.yml keeps the full
  # profile from Cargo.toml).
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Lint and the MSRV build only look at Rust, and nothing but the changelog runs for docs-only
    # changes. git diff sees every changed file, however many there are.
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python3 scripts/ci_changes.py "$BASE" HEAD
          'rust=src/**,vendor/**,Cargo.toml,Cargo.lock,.github/workflows/ci.yml'
          'code=!docs/**,!**.md,!.github/ISSUE_TEMPLATE/**,!.github/workflows/docs.yml,!.github/workflows/pr-title.yml'
          | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-linux-android
      - name: ALSA headers (audio devices and MIDI on Linux, the `alsa` feature)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --check
      - run: cargo clippy --features alsa -- -D warnings
      - name: cargo clippy without ALSA (a checkout without its headers)
        run: cargo clippy -- -D warnings
      - name: cargo clippy for Android (the prototype in android/)
        run: cargo clippy --target aarch64-linux-android -- -D warnings
        env:
          PYO3_CROSS_PYTHON_VERSION: "3.13"

  msrv:
    # Keep in sync with `rust-version` in Cargo.toml: catches syntax that
    # newer compilers accept but users with an older rustc can't build.
    name: Rust 1.88 (MSRV)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - name: ALSA headers (audio devices and MIDI on Linux, the `alsa` feature)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      - run: cargo check --locked --all-targets --features alsa

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs one job per OS, spread over the oldest, a middle and the newest
        # supported Python. main and manual runs test Linux on 3.10, 3.12 and 3.14, Linux on ARM,
        # Windows and macOS.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request'
          && '[{"os": "ubuntu-latest", "python": "3.14"}, {"os": "windows-latest", "python": "3.12"}, {"os": "macos-latest", "python": "3.10"}]'
          || '[{"os": "ubuntu-latest", "python": "3.10"}, {"os": "ubuntu-latest", "python": "3.12"}, {"os": "ubuntu-latest", "python": "3.14"}, {"os": "ubuntu-24.04-arm", "python": "3.12"}, {"os": "windows-latest", "python": "3.12"}, {"os": "macos-latest", "python": "3.12"}]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: ALSA headers (audio devices and MIDI on Linux, the `alsa` feature)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install maturin pytest pytest-xdist pillow mcp anthropic
          maturin build --release --out dist --features alsa
      - name: Install and test it
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist pyzed-ui
          python -m pytest -q -n auto tests
      - name: Upload the visual diffs
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-${{ matrix.os }}-py${{ matrix.python }}
          path: tests/visual/output/
          if-no-files-found: ignore

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Preview the next release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install git-cliff
          python scripts/changelog.py --preview | tee -a "$GITHUB_STEP_SUMMARY"
