name: PR title

# Release notes are built from commit messages, and with "Squash and merge"
# the PR title becomes the commit message, so it has to follow the gitmoji
# convention described in CONTRIBUTING.md.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  gitmoji:
    name: Gitmoji title
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: python
        run: |
          import os, re, sys

          title = os.environ["TITLE"]
          emojis = (
              "💥 ✨ 🎉 🚸 ♿ 💄 🔊 🐛 🚑 🩹 🔒 ♻ ⚡ 🎨 🔥 🚚 🏷 ⚰ 🗑 ⬆ ⬇ 📌 ➕ ➖ "
              "📝 ✏ 💡 📄 🍱 📸 🌐 👷 💚 🔧 🔨 ✅ 🧪 🙈 📦 🚨 🧑‍💻 👥 🔖 ⏪"
          ).split()
          shortcode = re.match(r"^:[a-z0-9_+-]+: \S", title)
          ok = shortcode or any(
              re.match(rf"^{re.escape(e)}️? \S", title) for e in emojis
          )
          if not ok:
              print(
                  f"::error::PR title {title!r} must start with a gitmoji and a space, "
                  "for example '✨ Add hot reload' or '🐛 Fix editor scroll'. "
                  "See CONTRIBUTING.md#commit-messages-and-pr-titles."
              )
              sys.exit(1)
          print(f"OK: {title}")
