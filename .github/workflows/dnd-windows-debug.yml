# Temporary: finds why tests/test_dnd.py fails now and then on Windows (with the trace of src/dnd.rs). Removed before merging.
name: DnD on Windows (debug)
on:
  push:
    branches: [claude/project-thread-zu432s]
jobs:
  dnd:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install maturin pytest pytest-xdist pillow mcp anthropic
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist pyzed-ui
      - name: whole suite, 6 times, with the state of failed drags
        shell: bash
        env:
          PYTHONPATH: .github
          PYZED_DND_TRACE: "1"
        run: |
          for i in $(seq 6); do
            python -m pytest -q -p no:cacheprovider -p dnd_debug -n auto tests > out.txt 2>&1 || true
            grep -E "^FAILED|passed|failed" out.txt || true
            if grep -q "^FAILED tests/test_dnd" out.txt; then sed -n '/= FAILURES =/,/short test summary/p' out.txt | grep -v "^E  \|^    " | head -700; fi
          done
