# Temporary: finds why tests/test_dnd.py fails now and then on Windows. Removed before merging.
name: DnD on Windows (debug)
on:
  push:
    branches: [claude/project-thread-zu432s]
jobs:
  dnd:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install maturin pytest pytest-xdist pillow mcp anthropic
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist pyzed-ui
      - name: test_dnd alone, one process, 15 times
        shell: bash
        run: |
          for i in $(seq 15); do python -m pytest -q -p no:cacheprovider tests/test_dnd.py 2>&1 | grep -E "^FAILED|passed|failed" || true; done
      - name: test_dnd alone, 4 workers, 15 times
        shell: bash
        run: |
          for i in $(seq 15); do python -m pytest -q -p no:cacheprovider -n 4 tests/test_dnd.py 2>&1 | grep -E "^FAILED|passed|failed" || true; done
      - name: whole suite, 3 times
        shell: bash
        run: |
          for i in $(seq 3); do python -m pytest -q -p no:cacheprovider -n auto tests 2>&1 | grep -E "^FAILED|passed|failed" || true; done
