name: Release

# Runs when a vX.Y.Z tag is pushed (vX.Y.Z-rc.N, -beta.N, ... for
# pre-releases). Builds and tests the wheels and the sdist, publishes the wheels
# on PyPI with Trusted Publishing, builds the standalone Pyzed Design app for
# Linux, Windows and macOS, adds the version to CHANGELOG.md on main, creates
# the GitHub Release with its notes and files and redeploys the docs site.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.3.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: meta
        name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version ($version)"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    # The musllinux (Alpine) and Windows ARM wheels are new: one that fails to build must not hold back the release.
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, test: true }
          - { name: musllinux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, test: false, optional: true }
          - { name: musllinux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2, test: false, optional: true }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, test: true }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin, test: false }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc, test: false, optional: true }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Absolute links in the PyPI description
        shell: bash
        run: python scripts/pypi_readme.py "${{ needs.meta.outputs.tag }}"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || '2_28' }}
          sccache: "true"
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install pytest pytest-xdist
          python -m pip install --no-index --find-links dist pyzed-ui
          python -m pytest -q -n auto tests
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: sdist
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Absolute links in the PyPI description
        run: python3 scripts/pypi_readme.py "${{ needs.meta.outputs.tag }}"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  designer:
    name: Pyzed Design ${{ matrix.name }}
    needs: [meta, wheels]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-x64, runner: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.name }}
          path: wheels
      # Signing is optional: without these secrets the app is built unsigned, as before.
      - name: Import the signing certificate
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MACOS_CERTIFICATE" ]; then
            keychain="$RUNNER_TEMP/signing.keychain-db"
            echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "" "$keychain"
            security set-keychain-settings -lut 21600 "$keychain"
            security unlock-keychain -p "" "$keychain"
            security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
            security set-key-partition-list -S apple-tool:,apple: -k "" "$keychain" >/dev/null
            security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
            rm "$RUNNER_TEMP/cert.p12"
          elif [ "$RUNNER_OS" = Windows ] && [ -n "$WINDOWS_CERTIFICATE" ]; then
            echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
            echo "PYZED_SIGN_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
          fi
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: command -v iscc || [ -e "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ] || choco install innosetup --no-progress -y
      - name: Build the standalone designer
        shell: bash
        env:
          PYZED_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          PYZED_SIGN_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # The Agent panel's sign-in apps (optional, bundled into the designer only)
          PYZED_GITHUB_CLIENT_ID: ${{ secrets.PYZED_GITHUB_CLIENT_ID }}
          PYZED_GOOGLE_CLIENT_ID: ${{ secrets.PYZED_GOOGLE_CLIENT_ID }}
          PYZED_GOOGLE_CLIENT_SECRET: ${{ secrets.PYZED_GOOGLE_CLIENT_SECRET }}
        run: |
          python -m pip install pyinstaller uv anthropic keyring
          python -m pip install --no-index --find-links wheels pyzed-ui
          python scripts/build_designer.py --out designer --installer
      # The zip is what the app's updater downloads; the setup .exe and the .dmg are the installers.
      # (Upload the zip even if an installer failed.)
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: designer-${{ matrix.name }}
          path: |
            designer/*.zip
            designer/*.exe
            designer/*.dmg

  pypi:
    name: Publish on PyPI
    needs: [meta, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyzed-ui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # PyPI only gets the wheels, so pip and uv always install the Rust core built here and never
      # compile it on the user's machine. The sdist stays on the GitHub Release for packagers.
      - name: Wheels only, one for every platform
        run: |
          rm -f dist/*.tar.gz
          for platform in manylinux_2_28_x86_64 manylinux_2_28_aarch64 macosx_11_0_arm64 macosx_10_12_x86_64 win_amd64; do
            ls dist/*-abi3-*"$platform".whl > /dev/null || { echo "::error::no $platform wheel"; exit 1; }
          done
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  changelog:
    name: Update CHANGELOG.md
    needs: [meta, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Add the version to CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install git-cliff
          python scripts/changelog.py --update "$TAG"
      - name: Commit to main
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md was already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "🔖 Release notes for $TAG"
          git push origin HEAD:main

  github-release:
    name: GitHub Release
    needs: [meta, sdist, changelog, designer]
    # A failed designer build must not hold back the release of the library.
    if: ${{ !cancelled() && needs.changelog.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    steps:
      # main now has the version's section, including notes written by hand.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: designer-*
          merge-multiple: true
          path: dist
      # The Linux installer (also served by the docs site), the icon it adds to the menu and the
      # checksums it verifies the download with.
      - name: Installer script and checksums
        run: |
          cp docs/public/install.sh dist/install.sh
          cp docs/public/icon-512.png dist/pyzed-design.png
          (cd dist && sha256sum -- * > SHA256SUMS)
      # Signed build provenance for every file of the release: `gh attestation verify <file> -R albakore/pyzed`.
      # (PyPI gets its own attestations from Trusted Publishing.)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          python -m pip install git-cliff
          python scripts/changelog.py --notes "$TAG" > notes.md
          printf '\n\n```\npip install pyzed-ui==%s\n```\n' "${TAG#v}" >> notes.md
          {
            printf '\n**Pyzed Design** (the designer as a standalone app, uv included, that updates itself):\n\n'
            printf -- '- Windows: `pyzed-design-windows-x86_64-setup.exe` (installs for your user, no admin needed)\n'
            printf -- '- macOS: `pyzed-design-macos-arm64.dmg` or `pyzed-design-macos-x86_64.dmg`\n'
            printf -- '- Linux: `curl -fsSL https://albakore.github.io/pyzed/install.sh | sh`\n\n'
            printf 'The `pyzed-design-*.zip` files are the portable builds the app updates from. `SHA256SUMS` lists every checksum.\n'
          } >> notes.md
          flags=(--title "$TAG" --notes-file notes.md --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
      - name: Redeploy the documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Neither the push nor the release made with GITHUB_TOKEN trigger
          # other workflows, so start the site deploy explicitly.
          gh workflow run docs.yml --ref main
