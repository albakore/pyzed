name: Release

# Runs when a vX.Y.Z tag is pushed (vX.Y.Z-rc.N, -beta.N, ... for
# pre-releases). Builds and tests the wheels and the sdist, publishes them on
# PyPI with Trusted Publishing, adds the version to CHANGELOG.md on main,
# creates the GitHub Release with its notes and redeploys the docs site.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.3.0
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: meta
        name: Tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the Cargo.toml version ($version)"
            exit 1
          fi
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  wheels:
    name: Wheel ${{ matrix.name }}
    needs: meta
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, test: true }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64, test: true }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin, test: true }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin, test: false }
          - { name: windows-x64, runner: windows-latest, target: x64, test: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Absolute links in the PyPI description
        shell: bash
        run: python scripts/pypi_readme.py "${{ needs.meta.outputs.tag }}"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: "2_28"
          sccache: "true"
      - name: Test the wheel
        if: matrix.test
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links dist pyzed-ui
          python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: dist/*.whl

  sdist:
    name: sdist
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - name: Absolute links in the PyPI description
        run: python3 scripts/pypi_readme.py "${{ needs.meta.outputs.tag }}"
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  pypi:
    name: Publish on PyPI
    needs: [meta, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyzed-ui/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  changelog:
    name: Update CHANGELOG.md
    needs: [meta, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Add the version to CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install git-cliff
          python scripts/changelog.py --update "$TAG"
      - name: Commit to main
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md was already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "🔖 Release notes for $TAG"
          git push origin HEAD:main

  github-release:
    name: GitHub Release
    needs: [meta, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # main now has the version's section, including notes written by hand.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          python -m pip install git-cliff
          python scripts/changelog.py --notes "$TAG" > notes.md
          printf '\n\n```\npip install pyzed-ui==%s\n```\n' "${TAG#v}" >> notes.md
          flags=(--title "$TAG" --notes-file notes.md --verify-tag)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi
      - name: Redeploy the documentation site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Neither the push nor the release made with GITHUB_TOKEN trigger
          # other workflows, so start the site deploy explicitly.
          gh workflow run docs.yml --ref main
