name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"
      - "benchmarks/**"
      - "python/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"
      - "benchmarks/**"
      - "python/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # On a pull request, build the site only when something it shows changed, and check the API
    # reference only when the code it is generated from changed.
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      site: ${{ github.event_name != 'pull_request' || steps.filter.outputs.site == 'true' }}
      api: ${{ github.event_name != 'pull_request' || steps.filter.outputs.api == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - "docs/**"
              - "CHANGELOG.md"
              - "examples/**"
              - "benchmarks/**"
              - ".github/workflows/docs.yml"
            api:
              - "python/**"
              - "src/**"
              - "docs/scripts/**"
              - "docs/src/content/docs/reference/**"
              - "docs/src/content/docs/es/reference/**"
              - ".github/workflows/docs.yml"

  build:
    name: Build site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      # Optimizing the screenshots takes about 5 minutes from scratch; Astro keeps the results
      # in node_modules/.astro and only redoes the images that changed.
      - name: Restore the optimized images
        uses: actions/cache@v6
        with:
          path: docs/node_modules/.astro
          key: docs-images-${{ hashFiles('docs/package-lock.json', 'docs/src/assets/**', 'docs/screenshots/**') }}
          restore-keys: docs-images-
      - name: Build (reads CHANGELOG.md and marks the latest stable release)
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  api-reference:
    name: API reference up to date
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      # Only needs an importable build: skip LTO to compile faster.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: ALSA headers (the audio engine links ALSA on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libasound2-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
      - name: Build and install
        run: |
          python -m venv .venv
          # maturin develop installs the `dev` dependency group, which needs pip 25.1+ (`--group`).
          .venv/bin/pip install -U pip maturin
          .venv/bin/maturin develop --release
      - name: Check (warnings only)
        run: |
          .venv/bin/python docs/scripts/gen_api.py --check | sed 's/^/::warning title=Docs::/' || true
          .venv/bin/python docs/scripts/gen_api.py > /dev/null
          if ! git diff --quiet -- docs/src/content/docs/reference docs/src/content/docs/es/reference; then
            echo "::warning title=Docs::The API reference is out of date. Run 'python docs/scripts/gen_api.py' and commit the result."
            git diff --stat -- docs/src/content/docs/reference docs/src/content/docs/es/reference
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pages solo acepta despliegues desde main; tras cada release, release.yml
    # lanza este workflow en main con workflow_dispatch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
