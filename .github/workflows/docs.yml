name: Docs

on:
  # The `changes` job decides what runs: GitHub's paths filters only look at the first 300 changed
  # files, so big pull requests skipped the site and API checks.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # On main, rebuild and deploy when the site or the code its reference comes from changed (`main`).
    # On a pull request, build the site only when something it shows changed, and check the API
    # reference only when the code it is generated from changed.
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      site: ${{ github.event_name == 'pull_request' && steps.filter.outputs.site || steps.filter.outputs.main }}
      api: ${{ github.event_name == 'pull_request' && steps.filter.outputs.api || steps.filter.outputs.main }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: >-
          python3 scripts/ci_changes.py "$BASE" HEAD
          'site=docs/**,CHANGELOG.md,examples/**,benchmarks/**,.github/workflows/docs.yml'
          'api=python/**,src/**,docs/scripts/**,docs/src/content/docs/reference/**,docs/src/content/docs/es/reference/**,.github/workflows/docs.yml'
          'main=docs/**,CHANGELOG.md,examples/**,benchmarks/**,python/**,src/**,.github/workflows/docs.yml'
          | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: each page's "Last updated" date and the sitemap's <lastmod> come from git.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      # Optimizing the screenshots takes about 5 minutes from scratch; Astro keeps the results
      # in node_modules/.astro/assets and only redoes the images that changed. Only that folder:
      # the rest is the content store, whose cached pages keep linking the code blocks' old
      # stylesheet after the code theme changes, and that file is gone (code without colors).
      - name: Restore the optimized images
        uses: actions/cache@v6
        with:
          path: docs/node_modules/.astro/assets
          key: docs-assets-${{ hashFiles('docs/package-lock.json', 'docs/src/assets/**', 'docs/screenshots/**') }}
          restore-keys: docs-assets-
      - name: Build (reads CHANGELOG.md and marks the latest stable release)
        working-directory: docs
        env:
          # The download page asks GitHub which release has each file (scripts/sync-downloads.mjs).
          GITHUB_TOKEN: ${{ github.token }}
          # Search engine ownership checks, set as repository variables (contributing/seo.md).
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
          YANDEX_VERIFICATION: ${{ vars.YANDEX_VERIFICATION }}
        run: npm run build
      # The pages that differ from the live site, for IndexNow once they are deployed.
      - name: List new and changed pages
        run: python3 docs/scripts/indexnow.py changes docs/dist indexnow.txt
      - uses: actions/upload-artifact@v7
        with:
          name: indexnow
          path: indexnow.txt
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  api-reference:
    name: API reference up to date
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      # Only needs an importable build: skip LTO to compile faster.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
      - name: Build and install
        run: |
          python -m venv .venv
          # maturin develop installs the `dev` dependency group, which needs pip 25.1+ (`--group`).
          .venv/bin/pip install -U pip maturin
          .venv/bin/maturin develop --release
      - name: Check (warnings only)
        run: |
          .venv/bin/python docs/scripts/gen_api.py --check | sed 's/^/::warning title=Docs::/' || true
          .venv/bin/python docs/scripts/gen_api.py > /dev/null
          if ! git diff --quiet -- docs/src/content/docs/reference docs/src/content/docs/es/reference; then
            echo "::warning title=Docs::The API reference is out of date. Run 'python docs/scripts/gen_api.py' and commit the result."
            git diff --stat -- docs/src/content/docs/reference docs/src/content/docs/es/reference
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pages solo acepta despliegues desde main; tras cada release, release.yml
    # lanza este workflow en main con workflow_dispatch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      # Bing (and ChatGPT search, Copilot, DuckDuckGo), Yandex, Seznam, Naver and Yep crawl the new and
      # changed pages within hours. Best effort: a failure here never fails the deploy.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/scripts/indexnow.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          name: indexnow
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: python3 docs/scripts/indexnow.py submit indexnow.txt
