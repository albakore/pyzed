name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"
      - "python/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "examples/**"
      - "python/**"
      - "src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Build (reads CHANGELOG.md and marks the latest stable release)
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  api-reference:
    name: API reference up to date
    runs-on: ubuntu-latest
    env:
      # Only needs an importable build: skip LTO to compile faster.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wheel
      - name: Build and install
        run: |
          python -m venv .venv
          # maturin develop installs the `dev` dependency group, which needs pip 25.1+ (`--group`).
          .venv/bin/pip install -U pip maturin
          .venv/bin/maturin develop --release
      - name: Check (warnings only)
        run: |
          .venv/bin/python docs/scripts/gen_api.py --check | sed 's/^/::warning title=Docs::/' || true
          .venv/bin/python docs/scripts/gen_api.py > /dev/null
          if ! git diff --quiet -- docs/src/content/docs/reference docs/src/content/docs/es/reference; then
            echo "::warning title=Docs::The API reference is out of date. Run 'python docs/scripts/gen_api.py' and commit the result."
            git diff --stat -- docs/src/content/docs/reference docs/src/content/docs/es/reference
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Pages solo acepta despliegues desde main; tras cada release, release.yml
    # lanza este workflow en main con workflow_dispatch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
