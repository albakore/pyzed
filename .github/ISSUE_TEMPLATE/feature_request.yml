name: ✨ Feature request
description: Suggest a new widget, component or capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: How you would like to use it, ideally with a short code example.
      render: python
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Similar features in Iced, Zed or other toolkits, screenshots, links.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this
