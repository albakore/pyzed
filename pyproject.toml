[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyzed"
version = "0.2.0"
description = "Fast, modern GUIs for Python powered by Iced (Rust), with Zed-inspired components"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["gui", "iced", "rust", "zed", "ui", "desktop"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: User Interfaces",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/albakore/pyzed"

[project.scripts]
pyzed = "pyzed.cli:main"

[tool.maturin]
python-source = "python"
module-name = "pyzed._core"
features = ["pyo3/extension-module"]
