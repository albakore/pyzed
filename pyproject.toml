[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyzed-ui"
dynamic = ["version"]
description = "Fast, modern GUIs for Python powered by Iced (Rust), with Zed-inspired components"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["gui", "python gui", "desktop", "desktop app", "gui framework", "native", "iced", "rust", "zed", "ui", "visual designer", "gui builder", "tkinter alternative", "cross-platform"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Widget Sets",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: GPU",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# Language servers for the designer's code editor (completion, diagnostics, code lens).
designer = ["ty", "ruff"]
# The MCP server for AI agents (`pyzed mcp`).
mcp = ["mcp>=1.2"]
# AI agents (`pyzed.agents` and the designer's Agent panel): Claude's SDK and the system keychain.
agents = ["anthropic>=1.0", "keyring>=25"]

[dependency-groups]
dev = [
    "ty>=0.0.89",
]
# The build backend, the test runner and the type checker; `uv sync` installs them (default-groups below).
test = ["maturin>=1.7,<2.0", "pytest", "pytest-xdist", "pillow", "ty", "mcp>=1.2; python_version >= '3.10'", "anthropic>=1.0; python_version >= '3.10'"]

[project.urls]
Homepage = "https://albakore.github.io/pyzed/"
Documentation = "https://albakore.github.io/pyzed/getting-started/introduction/"
Download = "https://albakore.github.io/pyzed/download/"
Changelog = "https://albakore.github.io/pyzed/changelog/"
Repository = "https://github.com/albakore/pyzed"
Issues = "https://github.com/albakore/pyzed/issues"

[project.scripts]
pyzed = "pyzed.cli:main"

[tool.maturin]
python-source = "python"
module-name = "pyzed._core"
features = ["pyo3/extension-module"]

[tool.uv]
default-groups = ["test"]
# Rebuild the Rust core on `uv sync`/`uv run` when it changes (Python files are picked up live).
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Mistakes rather than style: undefined names, unused imports and variables, syntax errors and bugbear.
select = ["F", "E9", "B"]
# Loop variables kept for readability, closures called right away in their loop, zip without strict=
# (lengths are checked by hand where it matters), defaults computed once on purpose.
ignore = ["B007", "B008", "B010", "B023", "B905"]

[tool.ruff.lint.per-file-ignores]
# Tests read properties for their side effects and spell negative numbers out.
"tests/**" = ["B002", "B018"]
