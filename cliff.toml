# git-cliff builds each release section from the commit history. Commits and
# PR titles follow the FastAPI/gitmoji style described in CONTRIBUTING.md
# ("✨ Add ...", "🐛 Fix ...", "📝 Update docs ..."). scripts/changelog.py
# inserts the section into CHANGELOG.md without touching hand-written notes.

[changelog]
header = ""
body = """
{%- macro repo() -%}https://github.com/albakore/pyzed{%- endmacro -%}
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }}.\
{% if commit.remote.pr_number %} PR [#{{ commit.remote.pr_number }}]({{ self::repo() }}/pull/{{ commit.remote.pr_number }})\
{% else %} [{{ commit.id | truncate(length=7, end="") }}]({{ self::repo() }}/commit/{{ commit.id }})\
{% endif %}\
{% if commit.remote.username %} by [@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %}.
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
commit_preprocessors = [
  # ":sparkles: Add x" -> "✨ Add x", so both gitmoji spellings land in the same group.
  { pattern = "^:boom:", replace = "💥" },
  { pattern = "^:sparkles:", replace = "✨" },
  { pattern = "^:tada:", replace = "🎉" },
  { pattern = "^:bug:", replace = "🐛" },
  { pattern = "^:ambulance:", replace = "🚑️" },
  { pattern = "^:adhesive_bandage:", replace = "🩹" },
  { pattern = "^:recycle:", replace = "♻️" },
  { pattern = "^:zap:", replace = "⚡️" },
  { pattern = "^:art:", replace = "🎨" },
  { pattern = "^:fire:", replace = "🔥" },
  { pattern = "^:truck:", replace = "🚚" },
  { pattern = "^:arrow_up:", replace = "⬆️" },
  { pattern = "^:arrow_down:", replace = "⬇️" },
  { pattern = "^:pushpin:", replace = "📌" },
  { pattern = "^:heavy_plus_sign:", replace = "➕" },
  { pattern = "^:heavy_minus_sign:", replace = "➖" },
  { pattern = "^:memo:", replace = "📝" },
  { pattern = "^:pencil2:", replace = "✏️" },
  { pattern = "^:bulb:", replace = "💡" },
  { pattern = "^:globe_with_meridians:", replace = "🌐" },
  { pattern = "^:construction_worker:", replace = "👷" },
  { pattern = "^:green_heart:", replace = "💚" },
  { pattern = "^:wrench:", replace = "🔧" },
  { pattern = "^:hammer:", replace = "🔨" },
  { pattern = "^:white_check_mark:", replace = "✅" },
  { pattern = "^:bookmark:", replace = "🔖" },
  { pattern = "^:lock:", replace = "🔒️" },
  # Squash merges append "(#12)"; the PR link is added by the template instead.
  { pattern = "\\s*\\(#\\d+\\)$", replace = "" },
  { pattern = "\\s+$", replace = "" },
]
commit_parsers = [
  { message = "^🔖", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking Changes" },
  { message = "^💥", group = "<!-- 0 -->Breaking Changes" },
  { message = "^(✨|🎉|🚸|♿|💄|🔊)", group = "<!-- 1 -->Features" },
  { message = "^(🐛|🚑|🩹|🔒)", group = "<!-- 2 -->Fixes" },
  { message = "^(♻|⚡|🎨|🔥|🚚|🏷|⚰|🗑)", group = "<!-- 3 -->Refactors" },
  { message = "^(⬆|⬇|📌|➕|➖)", group = "<!-- 4 -->Upgrades" },
  { message = "^(📝|✏|💡|📄|🍱|📸)", group = "<!-- 5 -->Docs" },
  { message = "^🌐", group = "<!-- 6 -->Translations" },
  { message = "^(👷|💚|🔧|🔨|✅|🧪|🙈|📦|🚨|🧑‍💻|👥)", group = "<!-- 7 -->Internal" },
  # Conventional Commits keep working too.
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^(fix|revert)", group = "<!-- 2 -->Fixes" },
  { message = "^(perf|refactor|style)", group = "<!-- 3 -->Refactors" },
  { message = "^docs", group = "<!-- 5 -->Docs" },
  { message = "^(build|ci|chore|test)", group = "<!-- 7 -->Internal" },
  { message = ".*", group = "<!-- 7 -->Internal" },
]

[remote.github]
owner = "albakore"
repo = "pyzed"
