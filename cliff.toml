# git-cliff: genera CHANGELOG.md y las notas de cada release a partir de
# commits convencionales (feat:, fix:, perf:, docs:, ...; `!` o
# "BREAKING CHANGE:" marcan un cambio incompatible).

[changelog]
# Solo se usa para generar la sección de cada versión; scripts/changelog.py la
# inserta en CHANGELOG.md (formato Keep a Changelog) sin tocar lo escrito a mano.
header = ""
body = """
{%- macro remote_url() -%}https://github.com/albakore/pyzed{%- endmacro -%}
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Sin publicar]
{% endif %}
{%- set breaking = commits | filter(attribute="breaking", value=true) -%}
{% if breaking | length > 0 %}
### Breaking changes
{% for commit in breaking %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking_description %}{{ commit.breaking_description | upper_first }}{% else %}{{ commit.message | upper_first }}{% endif %} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endif %}
{%- for group, commits in commits | filter(attribute="breaking", value=false) | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+.*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\s+$', replace = "" },
]
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^Merge ", skip = true },
  { message = "^feat", group = "<!-- 0 -->Añadido" },
  { message = "^perf", group = "<!-- 1 -->Cambiado" },
  { message = "^refactor", group = "<!-- 1 -->Cambiado" },
  { message = "^style", group = "<!-- 1 -->Cambiado" },
  { message = "^fix", group = "<!-- 2 -->Corregido" },
  { message = "^revert", group = "<!-- 2 -->Corregido" },
  { message = "^docs", group = "<!-- 3 -->Documentación" },
  { message = "^test", group = "<!-- 5 -->Mantenimiento" },
  { message = "^(build|ci)", group = "<!-- 5 -->Mantenimiento" },
  { message = "^chore", group = "<!-- 5 -->Mantenimiento" },
  { message = ".*", group = "<!-- 6 -->Otros cambios" },
]
