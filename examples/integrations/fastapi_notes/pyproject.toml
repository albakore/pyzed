[project]
name = "pyzed-fastapi-notes"
version = "0.1.0"
description = "A Pyzed desktop client for a FastAPI REST API (httpx + Pydantic)."
requires-python = ">=3.10"
dependencies = ["pyzed-ui", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]

# Runs against this checkout of Pyzed; delete these two lines in a copy of the folder.
[tool.uv.sources]
pyzed-ui = { path = "../../..", editable = true }
