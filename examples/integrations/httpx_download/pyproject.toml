[project]
name = "pyzed-httpx-download"
version = "0.1.0"
description = "A Pyzed download manager: httpx streaming responses with a live progress bar."
requires-python = ">=3.10"
dependencies = ["pyzed-ui", "httpx>=0.27"]

# Runs against this checkout of Pyzed; delete these two lines in a copy of the folder.
[tool.uv.sources]
pyzed-ui = { path = "../../..", editable = true }
