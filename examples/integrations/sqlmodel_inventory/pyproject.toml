[project]
name = "pyzed-sqlmodel-inventory"
version = "0.1.0"
description = "A Pyzed inventory app on SQLModel: Pydantic validation in the form, SQLAlchemy underneath."
requires-python = ">=3.10"
dependencies = ["pyzed-ui", "sqlmodel>=0.0.22"]

# Runs against this checkout of Pyzed; delete these two lines in a copy of the folder.
[tool.uv.sources]
pyzed-ui = { path = "../../..", editable = true }
