[project]
name = "pyzed-django-polls"
version = "0.1.0"
description = "Django's tutorial polls app with Pyzed desktop apps: one on the ORM, one over HTTP."
requires-python = ">=3.10"
dependencies = ["pyzed-ui", "django>=5.0", "httpx>=0.27"]

# Runs against this checkout of Pyzed; delete these two lines in a copy of the folder.
[tool.uv.sources]
pyzed-ui = { path = "../../..", editable = true }
