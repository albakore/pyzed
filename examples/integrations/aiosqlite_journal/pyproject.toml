[project]
name = "pyzed-aiosqlite-journal"
version = "0.1.0"
description = "A Pyzed journal on aiosqlite: async SQLite queries on Pyzed's asyncio loop."
requires-python = ">=3.10"
dependencies = ["pyzed-ui", "aiosqlite>=0.20"]

# Runs against this checkout of Pyzed; delete these two lines in a copy of the folder.
[tool.uv.sources]
pyzed-ui = { path = "../../..", editable = true }
