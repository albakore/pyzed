[package]
name = "pyzed"
version = "1.10.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, modern GUIs for Python powered by Iced"
license = "MIT"
repository = "https://github.com/albakore/pyzed"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tiny-skia",
    "crisp",
    "web-colors",
    "thread-pool",
    "x11",
    "wayland",
    "advanced",
    "svg",
    "image",
    "canvas",
    "markdown",
    "qr_code",
    "linux-theme-detection",
] }
iced_test = "0.14"
# Named directly to draw effect layers (rotation, blur, bloom, backdrop blur) on each renderer.
iced_renderer = { version = "0.14", default-features = false }
iced_wgpu = { version = "0.14", default-features = false }
iced_tiny_skia = { version = "0.14", default-features = false }
# Sets the tab width of the text editors (see the fork note at the end).
iced_graphics = { version = "0.14", default-features = false }
# Named directly to skip the rebuild after callbacks that return `pz.UNCHANGED` (see the fork note at the end).
iced_winit = "0.14"
# Checks `pz.shader` code, so mistakes raise in Python instead of crashing the GPU.
naga = { version = "27", features = ["wgsl-in"] }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
elsa = "1.11"
png = "0.18"
image = "0.25"
bytes = "1"
# Audio engine (pyzed.audio): FFT and WAV files; devices and MIDI below.
rustfft = "6.4"
hound = "3.5"
rtrb = "0.4"

# Audio devices and MIDI on each system's low-latency API. On Linux they link ALSA, whose
# development files a checkout may not have, so there they come with the `alsa` feature (CI and
# the released wheels turn it on); without it the engine renders offline and on the silent clock.
# A faster allocator for the many small allocations of each view (widget trees, layout nodes, text).
[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
# Native file dialogs (Command.pick_files) and images on the clipboard (Command.paste_image).
rfd = "0.17"
arboard = { version = "3.7", features = ["wayland-data-control"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
cpal = "0.18"
midir = "0.11"

# Tray icons (pz.TrayIcon): the system's own tray on Windows and macOS.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.24", default-features = false }

# PulseAudio is a pure-Rust client (it also reaches PipeWire); ALSA is the fallback.
[target.'cfg(target_os = "linux")'.dependencies]
# Tray icons over D-Bus (StatusNotifierItem), without GTK.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
cpal = { version = "0.18", features = ["pulseaudio", "realtime"], optional = true }
midir = { version = "0.11", optional = true }

# Android (a prototype): winit runs as a NativeActivity, so the app needs no Java code.
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30", features = ["android-native-activity"] }
# Calls into Java: the safe area (WindowInsets) and the back button (moveTaskToBack).
jni = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# Audio devices and MIDI on Linux: needs libasound2-dev and pkg-config (Fedora: alsa-lib-devel).
alsa = ["dep:cpal", "dep:midir"]
# Extra audio hosts for builds from source: ASIO needs Steinberg's SDK (CPAL_ASIO_DIR) on Windows,
# JACK its development files. `maturin develop --release --features asio`.
asio = ["cpal/asio"]
jack = ["alsa", "cpal/jack"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

# Iced comes from Pyzed's fork: the 0.14 release with Pyzed's changes (effect layers, tab widths,
# `iced_winit::quiet`, the Android handoff) and the community pull requests listed in its PYZED.md.
# To update it, push to the `pyzed-0.14` branch of albakore/iced and bump `rev` here.
[patch.crates-io]
iced = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_core = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_debug = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_futures = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_graphics = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_program = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_renderer = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_runtime = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_selector = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_test = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_tiny_skia = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_wgpu = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_widget = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
iced_winit = { git = "https://github.com/albakore/iced", rev = "ae3085777218857abb2c85860eff15ab7d47074b" }
